# Base config. Experiments inherit from this and change ONE thing.
exp_id: base
parent: null
note: "base config"
workers: 7            # processes for normalisation / features
threads: 7            # threads for sparse top-k retrieval
paths:
  data_dir: data                 # expects data/train/*.tsv and data/test/*.tsv
  work_dir: work                 # normalised parquet (cached by code hash)
  cache_dir: cache
  results_dir: results
  submissions_dir: submissions
  validator: ../student_resource/utils/validate_submission.py
sample:
  n_s1: 150000                   # train S1 entities used for training/validation (pool is never sampled)
  seed: 42
blocking:
  query_chunk: 200000
  retrievers:                    # word TF-IDF; tokens with doc-freq > max_df are dropped from retrieval
    - {name: name, view: name, k: 25, min_sim: 0.1, max_df: 20000}
    - {name: addr, view: addr, k: 25, min_sim: 0.1, max_df: 20000}
    - {name: name_addr, view: name_addr, k: 25, min_sim: 0.1, max_df: 20000}
  prune: {score: mean, max_k: 15, min_score: 0.05}
features: {version: f2}
model:
  params: {n_estimators: 3000, learning_rate: 0.05, num_leaves: 127, min_child_samples: 100,
           feature_fraction: 0.8, bagging_fraction: 0.8, bagging_freq: 1, reg_lambda: 1.0}
  early_stopping: 100
  cv: {folds: 5}
  seeds: [42]
  drop_features: []
  full_iter_mult: 1.1
decision:
  one_to_one: true               # audit: no S2/S3 id appears in two GT lists
  target_singleton_rate: null
  grid:                          # [lo, hi, step]
    t_first: [0.05, 0.90, 0.025]
    t_other: [0.10, 0.95, 0.05]
    t_extra: [0.10, 0.95, 0.05]
loco: true
